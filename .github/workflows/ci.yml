name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows is the target platform; Linux is cheap and catches the paths
    # and the line endings git hands back there.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs (a git waiting on a prompt) fails the job instead of
    # holding the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: git --version
      - run: cargo build --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features

  # Linux, Windows and macOS, all from this Linux runner (as verify.sh does):
  # clippy only type-checks, nothing links, and no dependency builds C, so the
  # other targets need nothing but rustup's std. macOS since 2026-10-16.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --target aarch64-apple-darwin -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  # ARM64, Windows and Linux: the tests on GitHub's ARM64 runners.
  # On a push to main and by hand, not on a pull request -- the x64 jobs gate
  # those, and this would add its wait to every one.
  arm64:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/arm64.yml
