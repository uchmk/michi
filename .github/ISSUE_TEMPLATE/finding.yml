name: Finding / 所見
description: Something a lane or a session saw that is not plainly a bug -- to sort / レーンやセッションが見つけたもので、はっきりしたバグではないもの（振り分け待ち）
labels: [finding]
body:
  - type: markdown
    attributes:
      value: |
        Opened by a session or a lane itself: `gh issue create -l finding,lane:cloud` (lane:win from the
        x64 machine, lane:arm from the ARM64 one). Something plainly wrong is a `bug`; a choice the owner
        or the two votes make is a `question`. The dev session turns a finding into a fix, a TODO.md line
        or nothing, and closes it with the version.

        セッションやレーンが自分で立てます（`gh issue create -l finding,lane:cloud`。x64 の実機は lane:win、ARM64 は lane:arm）。
        はっきり間違っているものは `bug`、持ち主か 2 票で決めることは `question` にします。直したら版を書いて閉じます。

  - type: dropdown
    id: lane
    attributes:
      label: From / 出どころ
      options:
        - lane:cloud (a cloud or PC session / クラウドか PC のセッション)
        - lane:win (x64 machine / x64 の実機)
        - lane:arm (ARM64 machine / ARM64 の実機)
    validations:
      required: true

  - type: input
    id: rev
    attributes:
      label: Version or commit / 版かコミット
      placeholder: v0.1.0 / main@abc1234
    validations:
      required: true

  - type: input
    id: rows
    attributes:
      label: TESTING row / TESTING の行
      placeholder: 1.3 / none
      description: The row of TESTING.md it is about, if any. / 関わる行（あれば）。

  - type: textarea
    id: what
    attributes:
      label: Steps, what was seen, what was expected / 手順・見えたもの・期待
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / 証拠
      description: Key log lines, a picture's path, the repository's state (`git status`, `git log --oneline -5`). / ログの行・画像のパス・リポジトリの状態。

  - type: checkboxes
    id: retest
    attributes:
      label: Re-test / 再テスト
      options:
        - label: Fixing it changes behaviour, so its rows need a `retest` issue / 直すと動きが変わるので、その行の `retest` の issue が要る
