# michi's values for the lanes' shared scripts (scripts/lanes.sh): the
# scripts are the same bytes in every uchmk app and read what differs from
# here. kura's scripts/lanes.conf says what each key is for.
app=michi
crate=michi
bin=michi
keys_env=MICHI_KEYS_DONE
state=michi-wintest
todo_marks=【人】 【金】 【実機】 要確認
# michi takes the ito-first check and its lists, not the test lanes' scripts.
files=lanes.sh ito-first.py ito-first.txt ito-required.txt release-sums.sh
# michi keeps its own workflows (build.yml checks michi.com), so none are written from ito's templates.
