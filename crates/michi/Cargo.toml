[package]
name = "michi"
description = "A keyboard-driven Git client for a repository many Claude Code sessions work in at once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `michi-com` (src/bin/michi-com.rs) makes two binaries, and a bare
# `cargo run` would not know which one to start.
default-run = "michi"

# The checklist generator; its own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }

[dependencies]
michi-core = { path = "../michi-core" }
# Every ito crate at the same rev.
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9", features = ["edit"] }
ito-layout = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9", features = ["egui"] }
ito-common = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9", features = ["clock", "egui"] }
ito-select = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-confirm = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-graph = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9", features = ["egui"] }
ito-match = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
# `michi.com` (src/bin/michi-com.rs) and the answers `say` writes.
ito-keys = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-help = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-palette = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-notify = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-console = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
# `michi mcp` (src/mcp.rs).
ito-mcp = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
# eframe's own defaults, but for `winit/default` (see tsumugi): the Wayland
# frame is drawn without the title's text, which brings an unmaintained crate.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "4e4d8b882185326a3dac7c9b965d5026ab57b7c9" }
