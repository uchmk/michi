[package]
name = "michi-core"
description = "michi's Git reading and logic, independent of the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ito-match = { git = "https://github.com/uchmk/ito", rev = "7c89de0ea874f2225d9ab7cc6d53d20ec541fec0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.2", features = ["unicode"] }
unicode-width = "0.2"
# Syntax colours for the diff (kura's pair: bat's grammar collection on
# syntect's pure-Rust regex engine, so nothing needs a C compiler).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
