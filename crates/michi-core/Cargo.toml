[package]
name = "michi-core"
description = "michi's Git reading and logic, independent of the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ito-proc = { git = "https://github.com/uchmk/ito", rev = "ef71a41b69cddf16900ce20a92eb8ef0f80ecf43" }
ito-common = { git = "https://github.com/uchmk/ito", rev = "ef71a41b69cddf16900ce20a92eb8ef0f80ecf43" }
ito-match = { git = "https://github.com/uchmk/ito", rev = "ef71a41b69cddf16900ce20a92eb8ef0f80ecf43" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
similar = { version = "3.2", features = ["unicode"] }
unicode-width = "0.2"
# Syntax colours for the diff (bat's grammars, shared with kura).
ito-syntax = { git = "https://github.com/uchmk/ito", rev = "ef71a41b69cddf16900ce20a92eb8ef0f80ecf43" }
